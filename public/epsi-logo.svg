<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="epsi-logo">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#4B3F99" opacity="0.1" stroke="#4B3F99" stroke-width="2"/>
  
  <!-- Main gradient defs -->
  <defs>
    <linearGradient id="epsiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4B3F99;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FC3C7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central hexagon (education/learning symbol) -->
  <g transform="translate(100, 100)">
    <!-- Outer hexagon -->
    <polygon points="0,-45 39,-23 39,23 0,45 -39,23 -39,-23" fill="url(#epsiGradient)" stroke="url(#accentGradient)" stroke-width="2"/>
    
    <!-- Inner design - graduation cap inspired -->
    <g transform="translate(0, -5)">
      <!-- Cap top -->
      <rect x="-25" y="-20" width="50" height="8" rx="2" fill="#FFFFFF" opacity="0.95"/>
      
      <!-- Cap band -->
      <rect x="-28" y="-12" width="56" height="4" rx="1" fill="#FFFFFF" opacity="0.8"/>
      
      <!-- Tassel -->
      <line x1="0" y1="-12" x2="0" y2="15" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="18" r="3" fill="#F39C12"/>
    </g>
    
    <!-- Accent dots (data points) -->
    <circle cx="-20" cy="-25" r="2.5" fill="#4FC3C7" opacity="0.8"/>
    <circle cx="20" cy="-25" r="2.5" fill="#4FC3C7" opacity="0.8"/>
    <circle cx="-30" cy="10" r="2" fill="#F39C12" opacity="0.6"/>
    <circle cx="30" cy="10" r="2" fill="#F39C12" opacity="0.6"/>
  </g>
  
  <!-- Text below logo -->
  <text x="100" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#4B3F99" letter-spacing="1.5">EPSI</text>
  <text x="100" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#4FC3C7" letter-spacing="0.5">PLATFORM</text>
</svg>
